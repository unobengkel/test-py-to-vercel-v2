<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Simulator - KameraTamu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
        
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">ESP32 Simulator</h1>
            <p class="text-blue-100 text-sm mt-1">Simulasi Jepretan Kamera & Upload ke Python</p>
        </div>

        <!-- Form Content -->
        <div class="p-6">
            <form id="simulatorForm" class="space-y-4">
                
                <!-- Server URL -->
                <div>
                    <label for="serverUrl" class="block text-sm font-medium text-gray-700 mb-1">URL Python Server</label>
                    <input type="text" id="serverUrl" value="https://test-py-to-vercel-v2.vercel.app" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
                    <p class="text-xs text-gray-500 mt-1">Gunakan alamat lokal jika server berjalan di komputer yang sama.</p>
                </div>

                <!-- Event Slug -->
                <div>
                    <label for="slug" class="block text-sm font-medium text-gray-700 mb-1">Event Slug</label>
                    <input type="text" id="slug" value="kamera-disposable" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
                </div>

                <!-- Image Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pilih Gambar (Simulasi Hasil Kamera)</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-blue-500 transition-colors cursor-pointer" id="dropZone">
                        <div class="space-y-1 text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="imageFile" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                                    <span>Pilih file</span>
                                    <input id="imageFile" name="imageFile" type="file" accept="image/*" class="sr-only" required>
                                </label>
                            </div>
                            <p class="text-xs text-gray-500">PNG, JPG, GIF hingga 1MB</p>
                        </div>
                    </div>
                    
                    <!-- Preview Image -->
                    <div id="imagePreviewContainer" class="hidden mt-3">
                        <p class="text-xs font-medium text-gray-700 mb-1">Preview:</p>
                        <img id="imagePreview" src="" alt="Preview" class="max-h-48 rounded-lg mx-auto border border-gray-200">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    <span id="btnText">Simulasi Jepret & Upload</span>
                    <div id="btnLoader" class="loader ml-2 hidden"></div>
                </button>
            </form>
        </div>

        <!-- Log Area -->
        <div class="bg-gray-50 border-t border-gray-200 p-6">
            <h3 class="text-sm font-medium text-gray-900 mb-2">Log Server:</h3>
            <div id="logArea" class="bg-gray-900 rounded-lg p-3 h-32 overflow-y-auto text-xs font-mono text-green-400 break-words whitespace-pre-wrap">
Waiting for action...
            </div>
        </div>
    </div>

    <script>
        const imageFile = document.getElementById('imageFile');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const form = document.getElementById('simulatorForm');
        const logArea = document.getElementById('logArea');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');

        // Fungsi mencetak log ke layar
        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const colorClass = isError ? 'text-red-400' : 'text-green-400';
            logArea.innerHTML += `\n<span class="text-gray-500">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            logArea.scrollTop = logArea.scrollHeight; // Auto scroll ke bawah
        }

        // Tampilkan preview saat gambar dipilih
        imageFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
                addLog(`File dipilih: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);
            }
        });

        // Tangani proses submit form
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const serverUrl = document.getElementById('serverUrl').value.replace(/\/$/, ""); // Hapus slash di akhir
            const slug = document.getElementById('slug').value;
            const file = imageFile.files[0];

            if (!file) {
                addLog("Error: Harap pilih gambar terlebih dahulu!", true);
                return;
            }

            // Atur status UI ke loading
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            btnText.innerText = "Mengirim...";
            btnLoader.classList.remove('hidden');

            const targetEndpoint = `${serverUrl}/upload-image/${slug}`;
            addLog(`\nMengirim request ke: ${targetEndpoint}...`);

            try {
                // Siapkan data sebagai multipart/form-data seperti ESP32
                const formData = new FormData();
                formData.append('image', file, file.name);

                // Eksekusi HTTP Request
                const response = await fetch(targetEndpoint, {
                    method: 'POST',
                    body: formData
                });

                const resultText = await response.text();
                
                let resultJson;
                try {
                    resultJson = JSON.parse(resultText);
                } catch(e) {
                    resultJson = resultText;
                }

                if (response.ok) {
                    addLog(`SUCCESS (HTTP ${response.status}):\n${JSON.stringify(resultJson, null, 2)}`);
                } else {
                    addLog(`ERROR (HTTP ${response.status}):\n${JSON.stringify(resultJson, null, 2)}`, true);
                }

            } catch (error) {
                addLog(`CONNECTION FAILED: ${error.message}\nPastikan server Python berjalan di ${serverUrl} dan CORS telah diizinkan.`, true);
            } finally {
                // Kembalikan status UI
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                btnText.innerText = "Simulasi Jepret & Upload";
                btnLoader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
